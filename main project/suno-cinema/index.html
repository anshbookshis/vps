    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('suno:appearance_settings') || '{}');
          if (s.theme && s.theme !== 'default') document.documentElement.setAttribute('data-theme', s.theme);
          if (s.amoled) document.documentElement.setAttribute('data-amoled', 'true');
        } catch (e) {}
      })();
    </script>
